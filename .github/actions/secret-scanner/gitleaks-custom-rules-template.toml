title = "Custom rules"

[extend]
useDefault = true

[[rules]]
id = "internal-urls"
description = "Identify internal urls"
regex = '''${GITLEAKS_REGEX_INTERNAL_URL}'''
tags = ["internal-urls"]

[[rules]]
id = "banned-ids"
description = "Identify banned IDs"
regex = '''${GITLEAKS_REGEX_BANNED_IDS}'''
tags = ["banned-ids"]

[allowlist]
description = "Global allowlist"
regexes = [
  '''^settings\.local$''',
  '''^steccm86\.ingress01\.dev\.nl\.cjscp\.org\.uk$''',
  '''^sonarqube-internal\.mdv\.cpp\.nonlive$''',
  '''^codereview\.mdv\.cpp\.nonlive$''',
  '''^52dd05dc-968e-4c62-9226-8649631ab000$'''
]

