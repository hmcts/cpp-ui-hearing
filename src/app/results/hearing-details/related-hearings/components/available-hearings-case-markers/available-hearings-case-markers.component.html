@if (casemarkers) {
<div class="case-markers">
  @if (casemarkers.length < 2) {
  <div class="case-marker-title" pdk-fill-colour="red">
    {{ casemarkers[0] }}
  </div>
  } @else {
  <details pdk-details class="case-marker-list-title" class="no-margin-bottom">
    <summary pdk-text-colour="red">
      {{ title }}
    </summary>
    <pdk-details-text pdk-text-colour="red">
      @for (casemarker of casemarkers; track $index) {
      <div class="case-marker">
        {{ casemarker }}
      </div>
      }
    </pdk-details-text>
  </details>
  }
</div>
}
